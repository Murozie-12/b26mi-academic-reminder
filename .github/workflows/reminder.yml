name: Academic Reminder Cron

on:
  schedule:
    - cron: '*/10 * * * *' # Setiap 10 menit (waktu UTC)
  workflow_dispatch:

# Mencegah dua robot mengirim notifikasi yang sama secara bersamaan.
concurrency:
  group: b26mi-academic-reminder
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies
        run: npm install --no-save firebase-admin
      - name: Run Deadline Checker
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node check-deadline.js
